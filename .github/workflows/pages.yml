name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Pages build type
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || true)
          build_type=$(printf '%s' "$body" | tr -d '\n' \
            | sed -n 's/.*"build_type":[[:space:]]*"\([a-z]*\)".*/\1/p')
          echo "build_type=${build_type:-none}" >> "$GITHUB_OUTPUT"
          echo "Detected Pages build type: ${build_type:-none}"

      - name: Assemble static site
        if: steps.pages.outputs.build_type == 'workflow'
        run: |
          mkdir -p _site
          cp -R index.html manifest.webmanifest sw.js css js vendor assets _site/

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.build_type == 'workflow'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
